services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      # Coolify substitutes the assigned FQDN and generates Traefik labels.
      SERVICE_FQDN_WEB_80: /

      # Runtime config for the React app. Because Vite/CRA bake env vars at
      # build time, we expose these via /env.js (see Dockerfile entrypoint
      # below) and read them as window._env_.API_BASE_URL in the app.
      API_BASE_URL: ${API_BASE_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s